name: Archive

# tools/github/archive.py once a day: the git history and every issue, pull request, discussion and release as JSON to
# a dated archive.org item, each new release's files to an item of their own, and the pages changed since yesterday to
# the Wayback Machine, so the project outlives a takedown or a suspended account (Hookshot, 13/11/2026).
# Needs the IA_ACCESS_KEY_ID and IA_SECRET_ACCESS_KEY secrets (archive.org/account/s3.php).
on:
  schedule:
    - cron: "41 3 * * *"
  # By hand: the first run saves every page (hours 100000, max 1000: one every 12 s, about an hour)
  workflow_dispatch:
    inputs:
      hours:
        description: Wayback pages changed in the last hours
        default: "26"
      max:
        description: At most this many Wayback pages
        default: "120"

permissions:
  contents: read

concurrency:
  group: archive

env:
  GH_TOKEN: ${{ github.token }}
  IA_ACCESS_KEY_ID: ${{ secrets.IA_ACCESS_KEY_ID }}
  IA_SECRET_ACCESS_KEY: ${{ secrets.IA_SECRET_ACCESS_KEY }}

jobs:
  items:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Repository and GitHub data
        run: |
          git bundle create "$RUNNER_TEMP/repo.bundle" --all
          uv run tools/github/archive.py snapshot "$RUNNER_TEMP/repo.bundle" --apply
      - name: Release files
        run: uv run tools/github/archive.py releases --apply

  wayback:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools/github
      - uses: astral-sh/setup-uv@v6
      - name: Changed pages
        run: uv run tools/github/archive.py wayback --hours "${{ inputs.hours || 26 }}" --max "${{ inputs.max || 120 }}" --apply
