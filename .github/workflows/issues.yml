name: Issue moderation

# tools/github/moderate.py on each issue event: release and GPU labels, empty reports closed, logs asked for, known
# errors answered (tools/github/signatures.toml), maintainers' "Fixed in vX" / "is the same as #N" replies closed.
# Every 6 hours it closes what waited long enough for its author and asks old quiet reports to try the latest release
# (once a day ran hours late and left issues open days past their limit, 14/11/2026); a published release closes the
# fixed-next-release ones.
on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  release:
    types: [published]
  schedule:
    - cron: "17 */6 * * *"
  # By hand: the daily sweep, every open issue as if new (backlog) or one issue; dry run prints without acting
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options: [sweep, backlog, issue]
        default: sweep
      issue:
        description: Issue number (task issue)
        required: false
      dry_run:
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

concurrency:
  group: issues-${{ github.event.issue.number || github.event_name }}

jobs:
  moderate:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools/github
      - name: Moderate
        env:
          EVENT: ${{ github.event_name }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT: ${{ github.event.comment.id }}
          TAG: ${{ github.event.release.tag_name }}
          TASK: ${{ inputs.task }}
          ONE: ${{ inputs.issue }}
          APPLY: ${{ inputs.dry_run && ' ' || '--apply' }}
        run: |
          cd tools/github
          case "$EVENT" in
            issues) python3 moderate.py issue "$ISSUE" --apply ;;
            issue_comment) python3 moderate.py comment "$ISSUE" "$COMMENT" --apply ;;
            release) python3 moderate.py release "$TAG" --apply ;;
            workflow_dispatch)
              case "$TASK" in
                issue) python3 moderate.py issue "$ONE" $APPLY ;;
                *) python3 moderate.py "$TASK" $APPLY ;;
              esac ;;
            *) python3 moderate.py sweep --apply ;;
          esac
